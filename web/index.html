<main>
  <div class="mark">
    <img src="hedwig-mark.svg" alt="Hedwig owl mark" width="28" height="28">
    <span class="wordmark">Hedwig</span>
  </div>

  <p class="statement">Hedwig is the policy check your payment agent has to pass before it moves money onchain.</p>

  <section aria-labelledby="proof-heading">
    <h2 id="proof-heading" class="proof-label">Devnet, four asks, one role</h2>
    <ul class="proof-list">
      <li>
        <span class="verdict">allow</span>
        <span class="reason">ROLE_HELD, AMOUNT_WITHIN_CAP</span>
      </li>
      <li>
        <span class="verdict">deny</span>
        <span class="reason">AMOUNT_EXCEEDS_CAP</span>
      </li>
      <li>
        <span class="verdict">unknown</span>
        <span class="reason">ROLE_FACT_MISSING</span>
      </li>
      <li>
        <span class="verdict">deny after revoke</span>
        <span class="reason">ROLE_MEMBER_MISSING</span>
        <a href="https://explorer.solana.com/tx/3en8dhiTnb29xVsCQnsGLCaZLtnVZJNYGNFc5hkxzZ2UUDkw3ygGQLVgJN1EsvmLDryuzgK9H5sMcuKZU3qbYE6V?cluster=devnet" class="tx-link">revoke tx</a>
      </li>
    </ul>
  </section>

  <nav class="links" aria-label="Project links">
