      <polygon points="0,-68 70,42 46,60 0,-28" fill="#8b85a3" fill-opacity="0.55"/>
      <circle cx="-27" cy="-13" r="16" fill="#3b82f6"/>
      <circle cx="27" cy="-13" r="16" fill="#3b82f6"/>
      <circle cx="-27" cy="-13" r="6" fill="#0d0b16"/>
      <circle cx="27" cy="-13" r="6" fill="#0d0b16"/>
      <polygon points="-10,4 10,4 0,24" fill="#0d0b16"/>
      <g fill="none" stroke="#8b85a3" stroke-width="1.8" stroke-linecap="round">
        <circle cx="0" cy="46" r="7"/>
        <line x1="0" y1="53" x2="0" y2="70"/>
        <line x1="0" y1="64" x2="7" y2="64"/>
      </g>
    </g>
    <rect width="400" height="400" filter="url(#grain)" opacity="1" fill="none"/>
