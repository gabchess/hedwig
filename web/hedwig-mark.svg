      <polygon points="-52,-50 -29,-70 -23,-40" fill="#8b85a3"/>
      <polygon points="52,-50 29,-70 23,-40" fill="#8b85a3"/>
      <polygon points="0,-68 70,42 0,82 -70,42" fill="#c9c5da"/>
