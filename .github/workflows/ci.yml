name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn

      - name: Check website copy and links
        run: |
          node web/sync-copy.js --check
          node scripts/site-copy.test.js

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Check install guide execution boundaries
        run: node --test scripts/install-guide.test.js

      - name: Check TypeScript formatting
        run: yarn lint

      - name: Typecheck and test consult
        run: |
          yarn consult:typecheck
          yarn consult:test

      - name: Build consult
        run: yarn consult:build

      - name: Install mcp dependencies
        run: npm ci --ignore-scripts --prefix mcp

      - name: Typecheck and test the MCP server
        run: |
          yarn mcp:typecheck
          yarn mcp:build
          yarn mcp:test

      - name: Repeat the concurrent registry persistence check
        run: |
          for attempt in 1 2 3 4 5; do
            yarn mcp:test --grep "loses no entry when several server processes write one file"
          done

      - name: Audit MCP server dependencies
        run: npm audit --package-lock-only --audit-level=moderate --prefix mcp
